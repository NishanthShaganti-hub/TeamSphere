{% extends "base.html" %}

{% block title %}403 Forbidden{% endblock %}

{% block content %}
<div class="container" style="max-width: 600px; text-align: center; padding: 4rem 1rem;">
  <div class="card" style="padding: 3rem 2rem;">
    <h1 style="font-size: 3.5rem; color: var(--primary); margin-bottom: 0.5rem;">403</h1>
    <h2 style="font-size: 1.4rem; margin-bottom: 1rem;">Access Restricted</h2>
    <p style="color: var(--muted); margin-bottom: 2rem;">
      You do not have permission to view this resource or perform this action.
    </p>
    <div>
      <a href="{{ url_for('main.index') }}" class="btn btn-primary">
        Back to Home
      </a>
    </div>
  </div>
</div>
{% endblock %}
